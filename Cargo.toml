[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["rUEXDataRunner contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
regex = "1"
strsim = "0.11"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
directories = "5"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2

# Optimize dependencies (e.g. the `image` crate's resize) even in dev/test so
# the OCR pipeline's 2x upscale isn't painfully slow under `cargo test`.
[profile.dev.package."*"]
opt-level = 3

# The core crate does heavy per-word fuzzy matching over the OCR output; optimize
# it in dev too so `cargo test` (which runs the real OCR pipeline) stays quick.
[profile.dev.package.datarunner-core]
opt-level = 2
